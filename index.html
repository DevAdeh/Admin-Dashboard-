<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

  <div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
      <p class="logo">Admin<span>Adeh</span></p>
      <nav>
        <a href="#" class="nav-link active" data-page="overview">📊 Overview</a>
        <a href="#" class="nav-link" data-page="orders">🧾 Orders</a>
        <a href="#" class="nav-link" data-page="customers">👥 Customers</a>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="main-content">

      <header class="topbar">
        <h1 id="pageTitle">Overview</h1>
        <div class="profile">👤 Adeola</div>
      </header>

      <!-- Overview page -->
      <section id="overviewPage" class="page active">
        <div class="stats-grid" id="statsGrid"></div>

        <div class="chart-card">
          <h3>Sales — Last 7 Days</h3>
          <canvas id="salesChart"></canvas>
        </div>
      </section>

      <!-- Orders page -->
      <section id="ordersPage" class="page">
        <div class="table-card">
          <div class="table-header">
            <h3>Recent Orders</h3>
            <input type="text" id="orderSearch" placeholder="Search orders...">
          </div>
          <table id="ordersTable">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Item</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </section>

      <!-- Customers page -->
      <section id="customersPage" class="page">
        <div class="customers-grid" id="customersGrid"></div>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
